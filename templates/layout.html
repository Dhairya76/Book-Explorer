<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Search and explore books — built with Go and the Open Library API." />
    <title>Book Explorer</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">📚 Book Explorer</a>
      <form class="search-form" action="/" method="get" role="search">
        <input
          type="search"
          name="q"
          value="{{.Query}}"
          placeholder="Search books, authors, subjects…"
          aria-label="Search books"
        />
        <button type="submit">Search</button>
      </form>
    </header>

    <main class="content">
      {{template "content" .}}
    </main>

    <footer class="site-footer">
      Built with Go · Data from
      <a href="https://openlibrary.org" target="_blank" rel="noreferrer">Open Library</a>
    </footer>
  </body>
</html>
